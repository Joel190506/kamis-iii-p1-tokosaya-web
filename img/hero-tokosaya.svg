  <rect width="800" height="320" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="798" height="318" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Monitor -->
  <rect x="290" y="46" width="220" height="132" rx="10" fill="#1E293B"/>
  <rect x="302" y="58" width="196" height="108" rx="6" fill="#4F46E5"/>
  <rect x="318" y="76" width="120" height="14" rx="7" fill="#F8FAFC"/>
  <rect x="318" y="100" width="164" height="10" rx="5" fill="#A5B4FC"/>
  <rect x="318" y="118" width="140" height="10" rx="5" fill="#A5B4FC"/>
  <rect x="318" y="136" width="96" height="10" rx="5" fill="#F59E0B"/>
  <rect x="388" y="178" width="24" height="24" fill="#334155"/>
  <rect x="340" y="202" width="120" height="12" rx="6" fill="#334155"/>

  <!-- Keyboard -->
