  <rect x="520" y="214" width="84" height="96" rx="42" fill="#4F46E5"/>
  <line x1="562" y1="216" x2="562" y2="280" stroke="#F8FAFC" stroke-width="3"/>
  <rect x="554" y="232" width="16" height="28" rx="8" fill="#F59E0B"/>
